<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استفتاء إقليم وسط وغرب سورية</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/main.css">
    <!-- reCAPTCHA (معطل حالياً) -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LcTP3YsAAAAAAD1i83N3kyUdtPmehIXgJdHQw2xH"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <!-- Language Switcher -->
        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-outline-secondary btn-sm" onclick="toggleLanguage()">
                <i class="bi bi-translate"></i> <span id="lang-text">English</span>
            </button>
        </div>

        <h1 class="text-center mb-4" data-i18n="title">استفتاء إقليم وسط وغرب سورية</h1>
        
        <div class="question">
            <p class="mb-0" data-i18n="question">هل توافق على تفويض الهيئة السياسية لإقليم وسط وغرب سورية ممثلة بالدكتور حسن مرهج بتمثيلك والدفاع عن حقوقك داخل سورية وخارجها وفق مبادئها المعلنة:</p>
            <ul class="mt-2" id="principles-list"></ul>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button class="btn btn-yes btn-lg px-5" onclick="vote('yes')" data-i18n="yes">نعم</button>
            <button class="btn btn-no btn-lg px-5" onclick="vote('no')" data-i18n="no">لا</button>
        </div>

        <div class="results">
            <h3 class="text-center" data-i18n="results">النتائج المباشرة</h3>
            <div class="row text-center">
                <div class="col">
                    <h4 data-i18n="yes">نعم</h4>
                    <p class="display-6" id="yes-count">0</p>
                    <p id="yes-percent">0%</p>
                </div>
                <div class="col">
                    <h4 data-i18n="no">لا</h4>
                    <p class="display-6" id="no-count">0</p>
                    <p id="no-percent">0%</p>
                </div>
            </div>
            <p class="text-center" id="total-text">إجمالي الأصوات: <span id="total">0</span></p>
        </div>

        <!-- Admin link -->
        <div class="text-center mt-3">
            <a href="admin.html" class="text-muted"><i class="bi bi-gear"></i> لوحة الإدارة</a>
        </div>
    </div>
    
    <script src="scripts/i18n.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
