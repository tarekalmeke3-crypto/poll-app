<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - استفتاء سورية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f8f9fa; }
        .admin-container { max-width: 600px; margin: 50px auto; }
        .results-panel { max-width: 800px; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-section" class="admin-container">
            <h2 class="text-center">دخول المشرف</h2>
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">كلمة المرور</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">دخول</button>
            </form>
            <div id="login-error" class="alert alert-danger mt-3 d-none"></div>
        </div>

        <div id="admin-panel" class="d-none">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h2>لوحة الإدارة</h2>
                <button class="btn btn-outline-danger" onclick="logout()">تسجيل خروج</button>
            </div>
            
            <div class="results-panel">
                <div class="card mt-4">
                    <div class="card-header">
                        <h4>النتائج التفصيلية</h4>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tr>
                                <th>نعم</th>
                                <td id="admin-yes">0</td>
                            </tr>
                            <tr>
                                <th>لا</th>
                                <td id="admin-no">0</td>
                            </tr>
                            <tr>
                                <th>الإجمالي</th>
                                <td id="admin-total">0</td>
                            </tr>
                        </table>
                        <button class="btn btn-success" onclick="exportCSV()">
                            <i class="bi bi-download"></i> تصدير CSV
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/admin.js"></script>
</body>
</html>
